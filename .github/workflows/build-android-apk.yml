name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code (Upgraded to v5 / latest)
      - name: Checkout Repository
        uses: actions/checkout@v5

      # Step 2: Set up JDK (Upgraded to v5)
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Step 3: Setup Node.js (If your build requires Node/React Native, upgraded to v5)
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # Step 4: Make Gradle wrapper executable
      - name: Make Gradlew Executable
        run: chmod +x gradlew

      # Step 5: Build the APK using Gradle
      - name: Build APK
        run: ./gradlew assembleDebug
